[package]
name = "libpinyin"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of libpinyin"
license = "MIT"

[lib]
name = "libpinyin"
path = "src/lib.rs"

[dependencies]
libchinese-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
libloading = "0.8"
