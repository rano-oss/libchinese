[package]
name = "libpinyin"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Pinyin Chinese input method engine with fuzzy matching, double pinyin, and user learning"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/rano-oss/libchinese"
homepage = "https://github.com/rano-oss/libchinese"
keywords = ["pinyin", "chinese", "ime", "input-method", "ibus"]
categories = ["internationalization", "text-processing"]
exclude = [
    "**/*.fst",
    "**/*.redb",
    "/target/",
    "lcov.info",
]

[lib]
name = "libpinyin"
path = "src/lib.rs"

[dependencies]
libchinese-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

[dev-dependencies]
libloading = "0.8"
