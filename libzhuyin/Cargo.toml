[package]
name = "libzhuyin"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Zhuyin (Bopomofo) Chinese input method engine built on libchinese-core"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/rano-oss/libchinese"
homepage = "https://github.com/rano-oss/libchinese"
keywords = ["zhuyin", "bopomofo", "chinese", "ime", "taiwan"]
categories = ["internationalization", "text-processing"]
exclude = [
    "**/*.fst",
    "**/*.redb",
    "/target/",
    "lcov.info",
]

[lib]
name = "libzhuyin"
path = "src/lib.rs"

[dependencies]
libchinese-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0", features = ["derive"] }
