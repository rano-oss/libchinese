[package]
name = "libzhuyin"
version = "0.1.0"
edition = "2021"
description = "Zhuyin/Bopomofo input engine built on libchinese-core"
license = "MIT"

[lib]
name = "libzhuyin"
path = "src/lib.rs"

[dependencies]
libchinese-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
