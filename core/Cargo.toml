[package]
name = "libchinese-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Shared lexicon, n-gram, user dictionary, and IME session core for Chinese input engines"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/rano-oss/libchinese"
homepage = "https://github.com/rano-oss/libchinese"
keywords = ["chinese", "ime", "pinyin", "zhuyin", "input-method"]
categories = ["internationalization", "text-processing"]
exclude = [
    "**/*.fst",
    "**/*.redb",
    "/target/",
    "lcov.info",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
redb = "2.1"
fst = "0.4"
lru = "0.16"
memmap2 = "0.9"
